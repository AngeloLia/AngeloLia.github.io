baseURL: "https://angelolia.github.io/"
languageCode: "zh-Hans"
defaultContentLanguage: "zh-hans"
title: "旧雨楼"
theme: "PaperMod"
description: "少年听雨歌楼上"

languages:
  zh-hans:
    languageName: "简体中文"
    languageCode: "zh-Hans"
    title: "旧雨楼"
    weight: 1

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  description: "少年听雨歌楼上"
  author: "Angelo"
  DateFormat: "2006-01-02"
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  defaultTheme: auto
  disableThemeToggle: false
  ShowToc: true
  TocOpen: false
  comments: false
  # Client-side search (Fuse.js): search page at /search/
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 1
    keys: ["title", "permalink", "summary", "content"]
  profileMode:
    enabled: false
  # Homepage hero (Home-Info mode, above the post list)
  homeInfoParams:
    Title: "旧雨楼"
    Content: "少年听雨歌楼上。"
  socialIcons: []

menu:
  main:
    - name: "文章"
      url: "/posts/"
      weight: 10
    - name: "归档"
      url: "/archives/"
      weight: 20
    - name: "搜索"
      url: "/search/"
      weight: 30
    - name: "关于"
      url: "/about/"
      weight: 40
